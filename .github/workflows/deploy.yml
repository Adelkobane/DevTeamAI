name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # Build both projects in Release configuration and publish the artifacts.
  # Runs on every push and pull request.
  # ---------------------------------------------------------------------------
  build:
    name: Build & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Node.js is required: DevTeam.Web builds Tailwind CSS v4 through the npm CLI during `dotnet build/publish`.
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: DevTeam.Web/package-lock.json

      - name: Restore
        run: dotnet restore DevTeamPortfolio.sln

      - name: Build (Release)
        run: dotnet build DevTeamPortfolio.sln --configuration Release --no-restore

      # If you add test projects, run them here:
      # - name: Test
      #   run: dotnet test DevTeamPortfolio.sln --configuration Release --no-build

      - name: Publish DevTeam.Api
        run: >
          dotnet publish DevTeam.Api/DevTeam.Api.csproj
          --configuration Release
          --no-build
          --output ${{ github.workspace }}/publish/api

      # Point the Blazor app at the production API. Set the repository variable API_BASE_URL
      # (Settings > Secrets and variables > Actions > Variables), e.g. https://my-api.azurewebsites.net
      - name: Configure API base URL for the web app
        if: ${{ vars.API_BASE_URL != '' }}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          # Merge so other settings (e.g. ContactEmail) are preserved
          jq --arg url "$API_BASE_URL" '.ApiBaseUrl = $url' DevTeam.Web/wwwroot/appsettings.json > appsettings.tmp
          mv appsettings.tmp DevTeam.Web/wwwroot/appsettings.json
          cat DevTeam.Web/wwwroot/appsettings.json

      - name: Publish DevTeam.Web
        run: >
          dotnet publish DevTeam.Web/DevTeam.Web.csproj
          --configuration Release
          --output ${{ github.workspace }}/publish/web

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: devteam-api
          path: publish/api
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: devteam-web
          path: publish/web/wwwroot
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Verify that the API Dockerfile builds (no push).
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image (API)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./DevTeam.Api
          file: ./DevTeam.Api/Dockerfile
          push: false
          tags: devteam-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy the API to Azure App Service (only from main).
  # Required:  variable AZURE_WEBAPP_NAME
  #            secrets  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (OIDC / federated credentials)
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API to Azure App Service
    needs: [build, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ vars.API_BASE_URL }}
    permissions:
      id-token: write # required for azure/login with OIDC
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devteam-api
          path: api

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: api

  # ---------------------------------------------------------------------------
  # Deploy the Blazor WebAssembly app to Azure Static Web Apps (only from main).
  # Required:  secret AZURE_STATIC_WEB_APPS_API_TOKEN
  # The app is pre-built above, so the Static Web Apps build step is skipped.
  # ---------------------------------------------------------------------------
  deploy-web:
    name: Deploy web to Azure Static Web Apps
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-web

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devteam-web
          path: web

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
          skip_api_build: true
